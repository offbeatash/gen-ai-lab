[project]
name = "agenticai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashish Pise", email = "aspise1817@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arxiv<4.0.0",
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-faiss>=0.1.1",
    "langchain-gemini>=0.1.1",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "tavily>=1.1.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
agenticai = "agenticai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
